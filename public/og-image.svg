<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="60" fill="#fbbf24" opacity="0.25"/>
  <circle cx="1100" cy="550" r="90" fill="#f472b6" opacity="0.2"/>
  <circle cx="1050" cy="100" r="50" fill="#34d399" opacity="0.2"/>
  <!-- Main card -->
  <rect x="120" y="90" width="960" height="450" rx="40" fill="url(#card)" stroke="#f59e0b" stroke-width="6"/>
  <!-- Emoji row -->
  <text x="600" y="230" font-size="90" text-anchor="middle" font-family="system-ui, sans-serif">🎈 🐶 🐱 🐰 🎈</text>
  <!-- Title -->
  <text x="600" y="340" font-size="56" font-weight="800" text-anchor="middle" fill="#78350f" font-family="system-ui, -apple-system, sans-serif">Tìm Hình Giống Nhau</text>
  <!-- Subtitle -->
  <text x="600" y="400" font-size="28" font-weight="600" text-anchor="middle" fill="#92400e" font-family="system-ui, -apple-system, sans-serif">Game Co-play 2 Người • 1 Màn Hình • Đối Diện</text>
  <!-- Bottom badge -->
  <rect x="380" y="440" width="440" height="50" rx="25" fill="#f59e0b"/>
  <text x="600" y="474" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, sans-serif">coplay-game.github.io</text>
</svg>
